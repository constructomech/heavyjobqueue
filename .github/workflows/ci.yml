name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HeavyJobQueue.sln
      - run: dotnet build HeavyJobQueue.sln --configuration Release --no-restore
      - run: dotnet test HeavyJobQueue.sln --configuration Release --no-build
      - run: >-
          dotnet publish src\HeavyJobQueue.App\HeavyJobQueue.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts\publish
